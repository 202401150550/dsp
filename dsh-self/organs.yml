# 自身器官图（迭代源）
# ----------------------------
# 细分：一个市场包拆成多个 atom，禁止 atom=市场包。
# 融合：atom 的主人是 dsh-self 的某个 organ；provider 只是临时供应商。
# 迭代：fused: true 之后，下一轮把实现搬进自身，关掉 provider，避免重复。
#
# status:
#   fused     — 已在自身里，可单独开关，不必再开别人的包
#   provider  — 本轮仍靠外来包；开任意 atom ≈ 开整个 provider（下一轮再拆实现）
#   pending   — 计划中的原子，尚未落地

