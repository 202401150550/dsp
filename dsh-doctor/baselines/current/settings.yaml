ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: longcat
  model: LongCat-2.0
ui-theme:
  preference: light
llm-pi-ai:
  providers:
    longcat:
      displayName: LongCat
      api: openai-completions
      baseURL: https://api.longcat.chat/openai
      apiKeyEnv: LONGCAT_API_KEY
      models:
        - id: LongCat-2.0
          name: LongCat 2.0
          contextWindow: 1000000
          maxTokens: 131072
          input:
            - text
    zhipu:
      displayName: 智谱 GLM
      api: openai-completions
      baseURL: https://open.bigmodel.cn/api/paas/v4
      apiKeyEnv: ZHIPU_API_KEY
      models:
        - id: glm-4.6v-flash
          name: GLM-4.6V-Flash
          contextWindow: 131072
          maxTokens: 4096
          input:
            - text
            - image
        - id: glm-4v-flash
          name: GLM-4V-Flash
          contextWindow: 8192
          maxTokens: 2048
          input:
            - text
            - image
    agnes:
      displayName: Agnes AI
      api: openai-completions
      baseURL: https://apihub.agnes-ai.com/v1
      apiKeyEnv: AGNES_API_KEY
      models:
        - id: agnes-2.5-flash
          name: Agnes 2.5 Flash
          contextWindow: 512000
          maxTokens: 65536
          input:
            - text
            - image
        - id: agnes-2.0-flash
          name: Agnes 2.0 Flash
          contextWindow: 262144
          maxTokens: 65536
          input:
            - text
            - image
        - id: agnes-1.5-flash
          name: Agnes 1.5 Flash
          contextWindow: 262144
          maxTokens: 65536
          input:
            - text
            - image
    deepseek:
      displayName: DeepSeek
      api: openai-completions
      baseURL: https://api.deepseek.com/v1
      apiKeyEnv: DEEPSEEK_API_KEY
      models:
        - id: deepseek-chat
          name: DeepSeek Chat
          contextWindow: 64000
          maxTokens: 8192
          input:
            - text
        - id: deepseek-reasoner
          name: DeepSeek R1
          contextWindow: 64000
          maxTokens: 8192
          input:
            - text
    bitexingai:
      displayName: BitexingAI
      api: anthropic-messages
      baseURL: https://new.bitexingai.com/v1
      apiKeyEnv: BITEXINGAI_API_KEY
      models:
        - id: claude-opus-4-6
          name: Claude Opus 4.6
          contextWindow: 200000
          maxTokens: 8192
          input:
            - text
            - image
        - id: claude-sonnet-4-6
          name: Claude Sonnet 4.6
          contextWindow: 200000
          maxTokens: 8192
          input:
            - text
            - image
        - id: claude-haiku-4-5
          name: Claude Haiku 4.5
          contextWindow: 200000
          maxTokens: 8192
          input:
            - text
agent-presets:
  default: anchored-standard
skin-background:
  backgroundOpacity: 15
  enabled: true
task-board: {}
aionui-panel:
  enabled: true
