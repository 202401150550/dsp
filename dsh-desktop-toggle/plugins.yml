# DSH Desktop 统一插件开关
# ----------------------------
# 用法：
#   1. 改下面 features 里的 true / false，或切档位：
#        node apply.mjs preset daily|bridge|full
#        node apply.mjs presets
#   2. 运行 apply.cmd（或 node apply.mjs）— 每次 apply 后自动 doctor check
#   3. 完全退出并重启 DSH Desktop
# 也可在设置页「功能开关」里单开单关（内部仍走本文件 + apply.mjs）。
#
# 说明：
# - always_on：桌面默认底座，始终加载（不要关）
# - features：可开关功能；false = 不写入启动列表
# - 禁止 dsh-web-ui-all / 皮肤中心整包（会卡在 Loading plugins...）
# - 只把 enabled 包写进 package.json（否则 dshmarket 会 hot-mount）
# - 第三方 web-ui / injector 的 link 一律指向 D:/dsp/vendor（勿再链 Downloads）
# - Desktop/Harness ≥0.2：勿开 web-ui-settings/task-board/live-stats/describe-image（dsh-settings 0.1→0.2 断裂）
# - 刷新 vendor：node D:/dsp/vendor/sync-from-downloads.mjs
# - 档位定义：presets.yml（daily 瘦身 / bridge 指挥舱 / full 全开）

profile: desktop
profile_dir: C:/Users/admin/.dsh/profiles/desktop

always_on:
  - id: dsh-base
    bundle: '@deepseek-ai/dsh-base'
  - id: dsh-web-app
    bundle: '@deepseek-ai/dsh-web-app'
  - id: dsh-self
    bundle: dsh-self
    dep: dsh-self
    link: D:/dsp/dsh-self
  - id: deep-whale-day-night
    bundle: '@dsh-external/dsh-client-ui-skin-deep-whale-day-night'
    dep: '@dsh-external/dsh-client-ui-skin-deep-whale-day-night'
    link: D:/dsp/deep-whale-day-night-theme
  # file-drop / smooth-stream / deepseek-usage 已收编进 dsh-self（organs iteration 9）
  # 源码仍在 dsh-file-drop、dsh-plugin-smooth-stream、dsh-deepseek-usage-patch，由 dsh-self compose 加载

features:
  # Desktop 2.0.4 / alpha.1 不能再挂官方 dsh-host-apiproxy（rc 与 alpha 导出名对不上）。
  # 用 dsp 兼容层提供 ctx.apiProxy，供 task-board Host 执行器使用。
  # 退出：dsh-apiproxy-compat/README.md · 探测：node apply.mjs probe-apiproxy
  host-apiproxy:
    enabled: false
    title: Host ApiProxy 网关（官方 rc，已弃用）
    group: desktop
    note: "勿开：rc.7 对 alpha.1 缺导出。probe-apiproxy 绿灯后再开；见 dsh-apiproxy-compat/README.md"
    insert_id: api-proxy-official
    name: '@deepseek-ai/dsh-host-apiproxy'
    dep: '@deepseek-ai/dsh-host-apiproxy'
    link: C:/Users/admin/AppData/Local/Programs/DSH Desktop/resources/app.asar.unpacked/node_modules/@deepseek-ai/dsh-host-apiproxy
    insert_config:
      nativeOpen: true

  apiproxy-compat:
    enabled: true
    title: ApiProxy 兼容层（alpha）
    group: desktop
    note: "为 task-board 提供 ctx.apiProxy；退出见 README + probe-apiproxy（bridge/full 档会开）"
    insert_id: api-proxy
    name: 'dsh-apiproxy-compat'
    dep: 'dsh-apiproxy-compat'
    link: D:/dsp/dsh-apiproxy-compat

  dsh-open-world:
    enabled: true
    title: 开放世界指挥中心
    group: web-ui
    note: NEXORA 风全屏界面；拓扑配置见 open-world.yml 或 ~/.dsh/open-world.yml
    # 自带 dsh.bundle.patch → 必须走 bundles，勿再 cordis.patch insert（否则 duplicate loader）
    bundle: dsh-open-world
    insert_id: dsh-open-world
    name: dsh-open-world
    dep: dsh-open-world
    link: D:/dsp/dsh-open-world

  web-ui-rewind:
    enabled: true
    title: 对话回退 Rewind
    group: web-ui
    note: 消息旁 ↶ 回退；文件快照 ~/.dsh/rewind-snapshots；Open World 时间轴
    bundle: dsh-rewind-plugin
    insert_id: dsh-rewind-plugin
    name: dsh-rewind-plugin
    dep: dsh-rewind-plugin
    link: D:/dsp/dsh-rewind-plugin

  ventus-progress:
    enabled: true
    title: 子代理进度
    group: web-ui
    note: progress-json 分段进度条；顶栏「进度」悬停面板（Ventus 单插件）
    bundle: dsh-ventus-progress
    insert_id: dsh-ventus-progress
    name: dsh-ventus-progress
    dep: dsh-ventus-progress
    link: D:/dsp/dsh-ventus-progress

  better-sidebar:
    enabled: true
    title: 右侧工作台
    group: web-ui
    note: VSCode 式侧栏：文件/编辑器/终端/Git/浏览器；ctx.betterSidebar 可扩展
    # 自带 dsh.bundle.patch → 走 bundles，勿再 cordis.patch insert（否则与 infer 漂移）
    bundle: dsh-better-sidebar
    insert_id: better-sidebar
    name: dsh-better-sidebar
    dep: dsh-better-sidebar
    link: D:/dsp/dsh-better-sidebar

  ventus-search:
    enabled: false
    title: Ventus 搜索
    group: web-ui
    note: Bing/360/Bilibili 多引擎 + Readability 正文抓取；输入框 @ 触发
    insert_id: dsh-ventus-search
    name: dsh-ventus-search
    dep: dsh-ventus-search
    link: D:/dsp/dsh-ventus-search

  dsh-market:
