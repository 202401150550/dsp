  hindsight:
    enabled: false
    title: Hindsight 长期记忆
    group: desktop
    note: "默认关。仅当本机 9077 daemon 已通再开；不通时每轮会卡 ~25s 做 reflect，表现为全模型 Request timed out（5/5）。不要和 openviking 一起开。关着时不要把 hindsight_* 写进 anchored-standard 的 bootstrapTools（否则 full catalog → ~7s 回答时间过长重试）。apply 会自动 patch-anchored-bootstrap。"
    insert_id: hindsight
    name: '@vectorize-io/hindsight-coding-agents/dsh'
    dep: '@vectorize-io/hindsight-coding-agents'
    version: 0.3.4
    bundle: '@vectorize-io/hindsight-coding-agents'

