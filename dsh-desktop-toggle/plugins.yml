    insert_id: dsh-mic-input
    name: dsh-mic-input
    dep: dsh-mic-input
    link: D:/dsp/dsh-mic-input
    bundle: dsh-mic-input

  dsh-voice:
    enabled: false
    title: 语音输入（离线）
    group: desktop
    note: 未 build、且会拉 sherpa-onnx，暂关以免 Desktop 起不来。Web Speech 在 Electron 下会 network error。
    insert_id: voice
    name: '@nn12138/dsh-voice'
    dep: '@nn12138/dsh-voice'
