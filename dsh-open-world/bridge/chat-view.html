<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSH 聊天坞</title>
<style>
  /* Open World 精修版皮肤（Apple-like）：中性近黑 + 单一金点缀 + 系统字体 */
  :root {
    --g: #E7B24B; --am: #E7B24B; --am2: rgba(231,178,75,.5); --am1: rgba(255,255,255,.08);
    --tx: #F2F2F4; --tx2: #A3A3A8; --tx3: #6B6B72;
    --bg: #0A0A0C; --pnl: rgba(255,255,255,.035); --elev: rgba(255,255,255,.06);
    --grn: #30D158; --red: #FF453A; --cyn: #64D2FF;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--tx); font: 13px/1.6 var(--ui); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--am1); }
  header .title { font-weight: 590; font-size: 14px; letter-spacing: -.01em; color: var(--tx); }
  header .title small { color: var(--tx3); font-weight: 400; margin-left: 8px; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
  header .stat { margin-left: auto; color: var(--tx2); font-size: 12px; display: flex; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
  .sig { width: 7px; height: 7px; border-radius: 50%; background: var(--grn); flex: none; }
  .sig.red { background: var(--red); }
  .ruler { height: 1px; background: var(--am1); }
  .pill { border: 1px solid var(--am1); border-radius: 999px; padding: 4px 11px; color: var(--tx2); font-size: 11.5px; background: var(--elev); }
  .pill.on { color: #F5D9A0; border-color: rgba(231,178,75,.5); background: rgba(231,178,75,.14); }
  main { flex: 1; display: flex; min-height: 0; }
  aside { width: 268px; min-width: 200px; border-right: 1px solid var(--am1); display: flex; flex-direction: column; min-height: 0; }
  .sect { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 560; color: var(--tx2); padding: 14px 16px 8px; }
  .sect::after { content: ""; flex: 1; height: 1px; background: var(--am1); }
  aside .search { padding: 0 12px 10px; }
  aside input[type=search], .composer textarea { width: 100%; background: rgba(0,0,0,.35); color: var(--tx); border: 1px solid var(--am1); border-radius: 10px; padding: 8px 11px; outline: none; font: inherit; font-size: 12.5px; }
  aside input[type=search]:focus, .composer textarea:focus { border-color: var(--am2); box-shadow: 0 0 0 3px rgba(231,178,75,.14); }
  .threads { overflow: auto; flex: 1; padding: 0 8px; }
  .thread { padding: 9px 10px; border-radius: 10px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .thread:hover { background: rgba(255,255,255,.055); }
  .thread.active { background: rgba(231,178,75,.14); }
  .thread .body { min-width: 0; flex: 1; }
  .thread .name { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .thread .last { color: var(--tx3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-family: var(--mono); font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,.1); color: var(--tx); }
  section.chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .messages { flex: 1; overflow: auto; padding: 4px 18px 6px; }
  .day { display: flex; align-items: center; gap: 10px; color: var(--tx3); font-size: 11px; font-weight: 560; margin: 14px 0 8px; }
  .day::after { content: ""; flex: 1; height: 1px; background: var(--am1); }
  .row { display: flex; margin-bottom: 8px; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: min(660px, 78%); padding: 9px 13px; border: 1px solid var(--am1); border-radius: 12px; background: rgba(255,255,255,.028); white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .row.me .bubble { border-left: 2px solid var(--g); }
  .row.agent .bubble { border-left: 2px solid var(--cyn); }
  .bubble .meta { font-family: var(--mono); font-size: 11px; color: var(--tx3); margin-top: 5px; display: flex; gap: 9px; font-variant-numeric: tabular-nums; }
  .bubble.system { border-left: 2px solid var(--tx3); background: rgba(255,255,255,.015); color: var(--tx2); }
  .att { display: inline-flex; align-items: center; gap: 8px; margin-top: 7px; padding: 5px 10px; border: 1px solid var(--am1); border-radius: 9px; background: var(--elev); color: var(--tx); text-decoration: none; font-size: 12px; }
  .att:hover { border-color: var(--am2); }
  .att .size { color: var(--tx3); font-size: 11px; }
  .composer { border-top: 1px solid var(--am1); padding: 12px 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 8px; }
  .chip { display: inline-flex; gap: 7px; align-items: center; border: 1px solid var(--am1); border-radius: 999px; background: var(--elev); color: var(--tx2); padding: 4px 11px; font-size: 12px; }
  .chip button { background: none; border: 0; color: var(--tx3); cursor: pointer; font-size: 13px; }
  .tools { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .btn { border: 1px solid var(--am1); border-radius: 9px; background: var(--elev); color: var(--tx); padding: 6px 14px; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 500; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn.primary { background: var(--g); border-color: transparent; color: #161006; font-weight: 600; }
  .btn.primary:hover { background: #F0C674; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .hint { color: var(--tx3); font-size: 11px; margin-left: auto; font-family: var(--mono); }
  .drop { outline: 2px dashed var(--am2); outline-offset: -8px; }
  .empty { color: var(--tx3); text-align: center; margin-top: 48px; }
  .offline { background: rgba(231,178,75,.1); color: #F5D9A0; padding: 8px 16px; font-size: 12px; display: none; }
</style>
</head>
<body>
<header>
  <div class="title"><span class="sig" id="sig"></span>&nbsp;聊天坞 <small>CHAT DOCK · 投递与对话一体</small></div>
  <div class="stat">
    <span class="pill" id="status">连接中…</span>
    <span class="pill" id="counts">—</span>
    <span class="pill" id="mode">本地存储</span>
  </div>
</header>
<div class="offline" id="offline">连接已中断，正在重试。未读取到的内容不会用示例数据代替。</div>
<main>
  <aside>
    <div class="sect">会话 · THREADS</div>
    <div class="ruler"></div>
    <div class="search">
      <input id="q" type="search" placeholder="搜索会话…" />
    </div>
    <div class="threads" id="threads"></div>
  </aside>
  <section class="chat">
    <div class="messages" id="messages"></div>
    <div class="composer" id="composer">
      <div class="chips" id="chips"></div>
      <textarea id="input" rows="3" placeholder="输入消息，Enter 发送，Shift+Enter 换行；可直接拖入或粘贴文件"></textarea>
      <div class="tools">
        <button class="btn" id="attach">📎 添加文件</button>
        <input type="file" id="file" multiple style="display:none" />
        <button class="btn primary" id="send">发送</button>
        <span class="hint" id="hint">附件上限 8 MB；敏感名（.env / *.pem / id_rsa 等）会被拒绝</span>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  var API = {
    threads: '/api/open-world/chat/threads',
    messages: '/api/open-world/chat/messages',
    post: '/api/open-world/chat/post',
    upload: '/api/open-world/chat/upload',
    read: '/api/open-world/chat/read',
    view: '/api/open-world/chat/file',
  };
  var state = { threads: [], threadId: null, messages: [], pending: [], online: false, timer: null };
  var el = function (id) { return document.getElementById(id); };


  function fmtTime(ts) {
    var d = new Date(ts || Date.now());
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function fmtDay(ts) {
    var d = new Date(ts || Date.now());
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function fmtSize(n) {
    if (!n && n !== 0) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  async function api(url, options) {
    var res = await fetch(url, Object.assign({ headers: { 'accept': 'application/json' } }, options || {}));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  function setStatus(text, cls) {
    el('status').textContent = text;
    el('status').className = 'pill' + (cls ? ' ' + cls : '');
  }

  async function loadThreads() {
    var data = await api(API.threads);
    state.threads = (data.threads || []);
    if (!state.threadId && state.threads.length) state.threadId = state.threads[0].id;
    if (!state.threads.length) state.threadId = 'main';
  }

  async function loadMessages() {
    if (!state.threadId) return;
    var data = await api(API.messages + '?thread=' + encodeURIComponent(state.threadId) + '&limit=300');
    state.messages = (data.messages || []).concat(state.pending);
  }

  async function refresh() {
    try {
      await loadThreads();
      await loadMessages();
      state.online = true;
      el('send').disabled = false; el('attach').disabled = false;
      setStatus('已连接', 'on');
      el('offline').style.display = 'none';
      render();
      api(API.read, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ threadId: state.threadId }),
      }).catch(function () {});
    } catch (e) {
      el('send').disabled = true; el('attach').disabled = true;
      el('offline').style.display = 'block';
      if (!state.online) {
        state.threadId = state.threadId || 'main';
        el('offline').style.display = 'block';
        setStatus('未连接', '');
        render();
      } else {
        setStatus('连接中断，重试中', '');
      }
      state.online = false;
    }
  }

  function render() {
    var q = (el('q').value || '').toLowerCase();
    var list = state.threads.filter(function (t) { return !q || (t.title || '').toLowerCase().indexOf(q) >= 0; });
    el('threads').innerHTML = list.map(function (t) {
      return '<div class="thread' + (t.id === state.threadId ? ' active' : '') + '" data-id="' + esc(t.id) + '">' +
        '<div class="body"><div class="name">' + esc(t.title || t.id) +
        (t.unread ? '<span class="badge">' + t.unread + '</span>' : '') + '</div>' +
        '<div class="last">' + esc(t.lastMessage || '（还没有消息）') + '</div></div>' +
        '<div class="last">' + fmtTime(t.updatedAt) + '</div></div>';
    }).join('') || '<div class="empty">还没有会话</div>';

    var lastDay = '';
    el('messages').innerHTML = state.messages.map(function (m) {
      var day = fmtDay(m.ts);
      var sep = day !== lastDay ? '<div class="day">' + day + '</div>' : '';
      lastDay = day;
      var atts = (m.attachments || []).map(function (a) {
        var href = typeof a.url === 'string' && /^(https?:\/\/|\/api\/open-world\/chat\/file\?)/i.test(a.url) ? a.url : null;
        if (!href) return '<span class="att">' + esc(a.name || '附件') + '（地址不可用）</span>';
        return '<a class="att" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">📄 ' + esc(a.name) +
          ' <span class="size">' + fmtSize(a.bytes) + '</span></a>';
      }).join('');
      var cls = m.role === 'user' ? 'row me' : (m.role === 'system' ? 'row system' : 'row agent');
      var bodyCls = m.role === 'system' ? 'bubble system' : 'bubble';
      var who = m.role === 'user' ? '我' : (m.role === 'system' ? '系统' : '助手');
      return sep + '<div class="' + cls + '"><div class="' + bodyCls + '">' + esc(m.text) + atts +
        '<div class="meta"><span>' + who + '</span><span>' + fmtTime(m.ts) + '</span>' +
        (m.status === 'sending' ? '<span>发送中…</span>' : (m.status === 'failed' ? '<span>失败</span>' : '')) +
        '</div></div></div>';
    }).join('') || '<div class="empty">开始第一句话吧</div>';
    var box = el('messages');
    box.scrollTop = box.scrollHeight;
    var active = state.threads.filter(function (t) { return t.id === state.threadId; })[0];
    el('counts').textContent = state.threads.length + ' 会话 · ' + state.messages.length + ' 消息';
    el('mode').textContent = '线程：' + (active ? active.title : state.threadId || '—');
  }

  function renderChips() {
    el('chips').innerHTML = state.pendingFiles ? '' : '';
    if (!state.pending.length) { el('chips').innerHTML = ''; return; }
    el('chips').innerHTML = state.pending.map(function (f, i) {
      return '<span class="chip">📎 ' + esc(f.name) + ' <span class="size">' + fmtSize(f.size) + '</span>' +
        '<button data-i="' + i + '" title="移除">×</button></span>';
    }).join('');
  }

  function pickThread(id) {
    state.threadId = id;
    state.pending = [];
    state.__uploaded = [];
    renderChips();
    loadMessages().then(render).catch(function () {});
    api(API.read, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ threadId: id }),
    }).catch(function () {});
  }

  async function send() {
    if (!state.online) { el('hint').textContent = '未连接，内容未发送。'; return; }
    var text = el('input').value.trim();
    if (!text && !state.pending.length) return;
    var tid = state.threadId;
    var local = { id: 'local-' + Date.now(), role: 'user', text: text, attachments: [], status: 'sending', ts: Date.now() };
    state.messages.push(local);
    state.pending = [];
    el('input').value = '';
    renderChips();
    render();
    try {
      var atts = [];
      for (var i = 0; i < (local.__files || []).length; i += 1) { /* attached below */ }
      if (state.__uploaded && state.__uploaded.length) { atts = state.__uploaded; state.__uploaded = []; }
      await api(API.post, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ threadId: tid, text: text, attachments: atts, role: 'user' }),
      });
      local.status = 'sent';
      await loadMessages();
      render();
    } catch (e) {
      local.status = 'failed';
      el('hint').textContent = '发送失败：' + e.message + '（本地草稿仍在输入框上方）';
      render();
    }
  }

  async function uploadFiles(files) {
    if (!state.online) { el('hint').textContent = '未连接，附件未上传。'; return; }
    state.__uploaded = state.__uploaded || [];
    for (var i = 0; i < files.length; i += 1) {
      var f = files[i];
      try {
        var res = await fetch(API.upload + '?thread=' + encodeURIComponent(state.threadId) + '&name=' + encodeURIComponent(f.name), {
          method: 'POST',
          headers: { 'content-type': f.type || 'application/octet-stream' },
          body: f,
        });
        var data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        if (data.attachment) state.__uploaded.push(data.attachment);
        state.pending.push({ name: f.name, size: f.size });
        el('hint').textContent = '已上传 ' + f.name + '，点「发送」连同正文一起发出';
      } catch (e) {
        el('hint').textContent = '上传失败 ' + f.name + '：' + e.message;
      }
    }
    renderChips();
  }

  el('threads').addEventListener('click', function (ev) {
    var node = ev.target.closest('.thread');
    if (node) pickThread(node.getAttribute('data-id'));
  });
  el('chips').addEventListener('click', function (ev) {
    var i = ev.target.getAttribute && ev.target.getAttribute('data-i');
    if (i != null) { state.pending.splice(Number(i), 1); if (state.__uploaded) state.__uploaded.splice(Number(i), 1); renderChips(); }
  });
  el('send').addEventListener('click', send);
  el('input').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); send(); }
  });
  el('attach').addEventListener('click', function () { el('file').click(); });
  el('file').addEventListener('change', function (ev) { uploadFiles(ev.target.files); ev.target.value = ''; });
  el('q').addEventListener('input', render);

  var drop = el('composer');
  ['dragenter', 'dragover'].forEach(function (n) {
    drop.addEventListener(n, function (ev) { ev.preventDefault(); drop.classList.add('drop'); });
  });
  ['dragleave', 'drop'].forEach(function (n) {
    drop.addEventListener(n, function (ev) { ev.preventDefault(); drop.classList.remove('drop'); });
  });
  drop.addEventListener('drop', function (ev) {
    if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) uploadFiles(ev.dataTransfer.files);
  });
  el('input').addEventListener('paste', function (ev) {
    var items = (ev.clipboardData && ev.clipboardData.files) || [];
    if (items.length) uploadFiles(items);
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) refresh();
  });

  refresh();
  state.timer = setInterval(function () { if (!document.hidden) refresh(); }, 3000);
})();
</script>
</body>
</html>
