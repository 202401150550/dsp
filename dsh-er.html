<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>DeepSeek Harness 数据模型</title>
  <style>
    :root { --bg: #fff; --fg: #222; --border: #ddd; }
    [data-theme="dark"] { --bg: #1a1a1a; --fg: #eee; --border: #444; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: SimSun, serif; background: var(--bg); color: var(--fg); padding: 20px; }
    .bar { position: fixed; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 10; }
    .bar button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); cursor: pointer; }
    h1 { text-align: center; margin-bottom: 5px; }
    .sub { text-align: center; color: #888; margin-bottom: 15px; }
    .box { border: 1px solid var(--border); border-radius: 8px; padding: 15px; max-width: 1400px; margin: 0 auto; overflow: auto; }
    .info { text-align: center; margin-top: 15px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <div class="bar">
    <button onclick="toggleTheme()">切换主题</button>
    <button onclick="exportPNG()">导出PNG</button>
    <button onclick="exportSVG()">导出SVG</button>

  <p class="info">实体: 6 | 联系: 5</p>
  <script>
    function toggleTheme() {
      const t = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', t);
      document.querySelector('svg')?.setAttribute('data-theme', t);
    }
    function exportPNG() {
      const svg = document.querySelector('svg');
      const data = new XMLSerializer().serializeToString(svg);
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = img.width * 2; c.height = img.height * 2;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const a = document.createElement('a');
        a.download = 'dsh-er.html.png';
        a.href = c.toDataURL('image/png');
        a.click();
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(data)));
    }
    function exportSVG() {
      const data = new XMLSerializer().serializeToString(document.querySelector('svg'));
      const a = document.createElement('a');
      a.download = 'dsh-er.html.svg';
      a.href = URL.createObjectURL(new Blob([data], {type:'image/svg+xml'}));
      a.click();
    }
    if (matchMedia('(prefers-color-scheme:dark)').matches) {
      document.body.setAttribute('data-theme', 'dark');
      document.querySelector('svg')?.setAttribute('data-theme', 'dark');
    }
  </script>
</body>
</html>
