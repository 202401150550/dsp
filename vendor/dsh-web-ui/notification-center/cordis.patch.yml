# bundle patch for the notification-center plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/notification-center`.
- insert:
    - id: ui-notification-center
      name: '@linxin666/dsh-client-ui-notification-center'
