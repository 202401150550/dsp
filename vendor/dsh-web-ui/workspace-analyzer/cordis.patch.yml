# bundle patch for the workspace-analyzer plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/workspace-analyzer`.
- insert:
    - id: ui-workspace-analyzer
      name: '@linxin666/dsh-client-ui-workspace-analyzer'
